<!doctype html><html><body><button id="run">Run DJ audio tests</button><pre id="result"></pre><script type="module">
import { DJTransport } from '/src/music/dj-transport.ts';
import { bufferLevel, wireTrack } from '/src/music/audio-engine.ts';
const wait = (ms) => new Promise(r => setTimeout(r, ms)); const assert = (ok, message) => { if (!ok) throw Error(message) };
document.querySelector('#run').onclick = async () => { const results = []; const output = document.querySelector('#result'); let player;
 try { const context = new AudioContext(); await context.resume(); player = new DJTransport(context); const buffer = context.createBuffer(2, context.sampleRate * 4, context.sampleRate); for(let ch=0;ch<2;ch++) { const data=buffer.getChannelData(ch); for(let i=0;i<data.length;i++) data[i]=Math.sin(2*Math.PI*440*i/context.sampleRate)*.2; }
 const track = { id:'qa', assetId:'qa', name:'QA', duration:4, bpm:120, beatOffset:0, start:0, end:4, volume:.7, low:0, mid:0, high:0 }; const session={tracks:[track],bpm:120,sync:false,crossfade:-1};
 player.load(0,track,buffer); player.load(1,{...track,id:'qa-b'},buffer); player.mix(-1,session); player.play(0,session); await wait(500); assert(player.position(0)>.02 && player.position(1)===0 && !player.channels[1].playing,'Independent playback: '+JSON.stringify({a:player.position(0),b:player.position(1),playing:player.channels.map(ch=>ch.playing),clock:context.currentTime,state:context.state})); const a=player.position(0); player.play(1,session); await wait(120); assert(player.position(0)>a && player.position(1)>.04,'Independent start reset another deck'); results.push('Independent A/B playback');
 player.pause(0); const paused=player.position(0); await wait(100); assert(Math.abs(player.position(0)-paused)<.001 && player.position(1)>.1,'Pause A affected B'); player.seek(1,1.5,session); await wait(70); assert(player.position(1)>1.5 && player.position(1)<1.8,'Seek failed'); results.push('Independent pause and live seek');
 player.mix(1,session); await wait(100); assert(player.channels[1].voice.gain.gain.value>.65,'Crossfader did not expose B'); player.mix(-1,session); await wait(100); assert(player.channels[1].voice.gain.gain.value<.01,'Crossfader failed to silence B'); results.push('Crossfader actual gains');
 player.apply(1,{...track,id:'qa-b',filter:.8},session); await wait(160); const magnitude=new Float32Array(1); player.channels[1].voice.filter.getFrequencyResponse(new Float32Array([440]),magnitude,new Float32Array(1)); assert(magnitude[0]<.03,'High-pass failed'); results.push('Real high-pass frequency response');
 player.apply(1,{...track,id:'qa-b',loopBeats:1,cue:.5},session); player.seek(1,.5,session); await wait(650); assert(player.position(1)>=.5 && player.position(1)<1,'Loop outside region'); results.push('Beat loop wraps correctly');
 player.apply(1,{...track,id:'qa-b'},session); player.seek(1,0,session); player.play(0,session); player.mix(-1,session); player.beginTransition(0,1,.25,true); await wait(300); const finished=player.tick(session); assert(finished && !player.channels[0].playing && player.channels[1].playing && player.crossfade===1,'A to B transition failed'); player.play(0,session); player.beginTransition(1,0,.2); await wait(240); assert(player.tick(session) && player.crossfade===-1 && !player.channels[1].playing,'B to A transition failed'); results.push('A → B → A transitions');

 assert(Math.abs(bufferLevel(buffer) - .1414) < .005, 'RMS level measurement'); results.push('Measured audio level');
 player.play(1,session); player.beginTransition(0,1,1,true); await wait(200); player.tick(session); await wait(90); assert(player.channels[0].voice.low.gain.value < -1 && player.channels[1].voice.low.gain.value < -1, 'Bass swap did not shape both decks'); player.cancelTransition(); await wait(150); assert(Math.abs(player.channels[1].voice.low.gain.value) < .2, 'Manual takeover failed to restore EQ'); results.push('Two-deck bass swap and manual takeover');
 player.beginTransition(0,1,1,false,context.currentTime,'filter'); await wait(250); player.tick(session); await wait(80); assert(player.channels[0].voice.filter.frequency.value > 30, 'Filter transition not applied'); player.cancelTransition();
 player.beginTransition(0,1,1,false,context.currentTime,'echo'); await wait(250); player.tick(session); await wait(80); assert(player.channels[0].voice.echo.gain.value > .04, 'Echo transition not applied'); player.cancelTransition(); results.push('Actual filter and echo transition effects');
 player.stop(); await context.close();
 const tail = async (echo,reverb) => { const offline=new OfflineAudioContext(2,44100,44100); const source=offline.createBuffer(2,2205,44100); for(let ch=0;ch<2;ch++) for(let i=0;i<2205;i++) source.getChannelData(ch)[i]=Math.sin(2*Math.PI*440*i/44100)*.2; const voice=wireTrack(offline,source,{...track,echo,reverb},{...session,crossfade:-1},0); voice.source.start(0); const rendered=await offline.startRendering(); let energy=0; const data=rendered.getChannelData(0); for(let i=11025;i<22050;i++) energy+=data[i]**2; return energy; }; const dry=await tail(0,0), echo=await tail(.6,0), reverb=await tail(0,.6); assert(echo>dry+.01 && reverb>dry+.001,'Echo/reverb did not render audio tails'); results.push('Actual echo and reverb output'); output.textContent='PASS\n'+results.join('\n');
 } catch(error) { output.textContent='FAIL: '+error.message+'\n'+results.join('\n'); player?.stop(); }
};
</script></body></html>
