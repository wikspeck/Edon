<!doctype html><html lang="en"><meta charset="utf-8"><title>Edon raster regression checks</title>
<style>body{font:15px/1.6 system-ui;margin:32px;background:#151517;color:#eee}li{padding:6px}canvas{image-rendering:pixelated;border:1px solid #555;margin:12px;width:224px;height:176px}</style>
<h1>Edon browser regression checks</h1><ol id="results"></ol><div id="samples"></div>
<script type="module">
import { createDocument, createElement } from '/src/model/document.ts'
import { createRasterStroke, paintRasterRegion, rasterizeElement } from '/src/editor/raster-engine.ts'
import { serializeArtwork } from '/src/editor/artwork-export.ts'
import { booleanSelection, selectionMask } from '/src/editor/vector-boolean.ts'
import { wireTrack, encodeWav } from '/src/music/audio-engine.ts'
import { saveAudioAsset, loadAudioAsset } from '/src/music/audio-assets.ts'
import { cleanDocHtml } from '/src/editor/doc-format.ts'
const settings = { color:'#000000', size:1, opacity:1, hardness:100, smoothing:0, stabilization:0, simplify:0, brushPreset:'hard', antiAlias:false, fillTolerance:24, contiguous:true }
const results = document.querySelector('#results')
const assert = (condition, label) => { const item = document.createElement('li'); item.textContent = `${condition ? 'PASS' : 'FAIL'} ${label}`; item.dataset.pass = String(condition); results.append(item); if (!condition) throw new Error(label) }
const imageFrom = (url) => new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=url})
const pixelsOf = async (element) => { const image = await imageFrom(element.imageUrl); const canvas=document.createElement('canvas'); canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;context.drawImage(image,0,0);return {canvas,data:context.getImageData(0,0,canvas.width,canvas.height).data} }
const isSolid = (data) => { for(let index=3;index<data.length;index+=4) if(data[index]!==0 && data[index]!==255)return false;return true }
try {
  const page=createDocument('Raster regression',64,64).pages[0]
  const outline=await createRasterStroke(page,null,[{x:3,y:3},{x:30,y:3},{x:30,y:24},{x:3,y:24},{x:3,y:3}],settings)
  const filled=await paintRasterRegion(outline,{x:10,y:10},{...settings,color:'#ff0000'})
  const first=await pixelsOf(filled.element)
  assert(filled.element.id===outline.id,'Fill edits the original raster layer')
  assert(filled.pixelCount===520,`Closed 1 px outline: all 520 interior pixels filled (actual ${filled.pixelCount})`)
  assert(isSolid(first.data),'No fractional alpha / half pixels with anti-aliasing off')
  assert([...first.data].filter((_,index)=>index%4===3).every(alpha=>alpha===255),'No transparent holes between outline and fill')
  document.querySelector('#samples').append(first.canvas)
  const moved={...outline,x:3.35,y:4.65,scaleX:1.3,scaleY:.8,rotation:23}
  const movedFill=await paintRasterRegion(moved,{x:moved.x+moved.width/2,y:moved.y+moved.height/2},{...settings,color:'#ff0000'})
  assert(movedFill.pixelCount===520,'Moved, scaled and rotated raster: exact same 520 source pixels filled')
  assert(movedFill.element.rotation===23 && movedFill.element.scaleX===1.3,'Fill preserves the raster transform')
  const rectangle=createElement('rectangle',7,9,19,13);rectangle.cornerRadius=0
  const rasterRectangle=await rasterizeElement(page,rectangle,settings)
  const shapeFill=await paintRasterRegion(rasterRectangle,{x:12,y:12},{...settings,color:'#00ff00'})
  assert(shapeFill.pixelCount===247,'Pixel rectangle: every one of 19 × 13 pixels recoloured')
  const ellipse=createElement('ellipse',7,9,19,13)
  const rasterEllipse=await rasterizeElement(page,ellipse,settings)
  const ellipsePixels=await pixelsOf(rasterEllipse)
  assert(isSolid(ellipsePixels.data),'Pixel ellipse has a hard grid boundary')
  const ellipseFill=await paintRasterRegion(rasterEllipse,{x:16,y:15},{...settings,color:'#00ff00'})
  const coloured=await pixelsOf(ellipseFill.element)
  let missing=0;for(let offset=0;offset<coloured.data.length;offset+=4)if(coloured.data[offset+3]===255 && coloured.data[offset+1]!==255)missing++
  assert(missing===0,'Pixel ellipse fill leaves zero unfilled shape pixels')
  const clean=cleanDocHtml('<p style="font-family: Georgia, serif; font-size: 27px; text-align:center">Text</p><img src=x onerror=alert(1)><script>alert(1)</'+'script>')
  assert(clean.includes('27px')&&clean.includes('Georgia')&&!clean.includes('onerror')&&!clean.includes('script'),'Rich text keeps numeric sizes and font family while removing executable HTML')
  const source=document.createElement('canvas');source.width=8;source.height=8;source.getContext('2d').fillRect(3,3,1,1)
  const image=createElement('image',8,8,8,8);image.imageUrl=source.toDataURL();image.effects=[{id:'test-outline',type:'outline',enabled:true,color:'#ffffff',opacity:1,width:2}]
  page.elements=[image]
  const svg=serializeArtwork(page,[image],{x:0,y:0,width:32,height:32},true)
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const rendered=await imageFrom(url);const exported=document.createElement('canvas');exported.width=32;exported.height=32;exported.getContext('2d').drawImage(rendered,0,0);URL.revokeObjectURL(url)
  const exportedPixels=exported.getContext('2d').getImageData(0,0,32,32).data
  let opaque=0;for(let offset=3;offset<exportedPixels.length;offset+=4)if(exportedPixels[offset]===255)opaque++
  assert(opaque===25,`PNG contour: one source pixel + a uniform 2 px outline = 25 opaque pixels (actual ${opaque})`)
  document.querySelector('#samples').append(exported)

  const firstStroke=await createRasterStroke(page,null,[{x:5,y:5},{x:25,y:5}],{...settings,size:3})
  const secondStroke=await createRasterStroke(page,null,[{x:5,y:15},{x:25,y:15}],{...settings,size:3,color:'#ff0000'})
  assert(firstStroke.id!==secondStroke.id,'Separate brush gestures produce independent raster layers')
  const left=createElement('rectangle',0,0,20,20);left.cornerRadius=0
  const right=createElement('rectangle',10,0,20,20);right.cornerRadius=0
  for(const [operation,area] of [['union',600],['subtract',200],['intersect',200],['exclude',400]]) {
    const combined=await booleanSelection([left,right],operation)
    const raster=await rasterizeElement({...page,width:64,height:64},combined,settings)
    const pixels=await pixelsOf(raster);let count=0;for(let i=3;i<pixels.data.length;i+=4)if(pixels.data[i]===255)count++
    assert(count===area,`${operation}: exact rendered area ${area} (actual ${count})`)
  }
  assert(await booleanSelection([left,{...right,x:30}],'intersect')===null,'Disjoint intersection produces empty geometry')
  assert(await booleanSelection([left,{...left,id:'cover'}],'subtract')===null,'Full subtraction produces empty geometry')
  const third={...right,id:'third',x:20};const three=await booleanSelection([left,right,third],'union')
  assert(three.width===40,'Boolean union handles three selected shapes')
  const masked={...left,width:40,height:40,mask:await selectionMask({...left,width:40,height:40},createElement('ellipse',10,10,20,20))}
  page.elements=[masked]
  const maskSvg=serializeArtwork(page,[masked],{x:0,y:0,width:40,height:40},true)
  const maskUrl=URL.createObjectURL(new Blob([maskSvg],{type:'image/svg+xml'}));const maskImage=await imageFrom(maskUrl);const maskCanvas=document.createElement('canvas');maskCanvas.width=40;maskCanvas.height=40;maskCanvas.getContext('2d').drawImage(maskImage,0,0);URL.revokeObjectURL(maskUrl)
  const maskPixels=maskCanvas.getContext('2d').getImageData(0,0,40,40).data
  assert(maskPixels[(20*40+20)*4+3]===255&&maskPixels[3]===0,'Selected shape mask clips the exported content')
  masked.mask.inverted=true;page.elements=[masked]
  const invertedUrl=URL.createObjectURL(new Blob([serializeArtwork(page,[masked],{x:0,y:0,width:40,height:40},true)],{type:'image/svg+xml'}));const invertedImage=await imageFrom(invertedUrl);maskCanvas.getContext('2d').clearRect(0,0,40,40);maskCanvas.getContext('2d').drawImage(invertedImage,0,0);URL.revokeObjectURL(invertedUrl)
  const inverted=maskCanvas.getContext('2d').getImageData(0,0,40,40).data
  assert(inverted[(20*40+20)*4+3]===0&&inverted[3]===255,'Inverted mask cuts a real hole in the exported content')
  const offline=new OfflineAudioContext(2,44100,44100);const tone=offline.createBuffer(1,44100,44100);tone.getChannelData(0).forEach((_,i,array)=>array[i]=.2*Math.sin(2*Math.PI*440*i/44100))
  const tone2=offline.createBuffer(1,44100,44100);tone2.getChannelData(0).forEach((_,i,array)=>array[i]=.2*Math.sin(2*Math.PI*880*i/44100))
  const mix={bpm:120,sync:true,crossfade:0};const t={bpm:120,volume:1,low:0,mid:0,high:0}
  wireTrack(offline,tone,t,mix,0).source.start(0);wireTrack(offline,tone2,{...t,bpm:60},mix,1).source.start(0)
  const mixed=await offline.startRendering();const samples=mixed.getChannelData(0)
  const amplitude=(hz,start=4410,end=17640)=>{let re=0,im=0;for(let i=start;i<end;i++){re+=samples[i]*Math.cos(2*Math.PI*hz*i/44100);im+=samples[i]*Math.sin(2*Math.PI*hz*i/44100)}return 2*Math.hypot(re,im)/(end-start)}
  assert(amplitude(440)>.13&&amplitude(1760)>.13,'Both decks render simultaneously and BPM sync changes the second playback rate')
  const eqContext=new OfflineAudioContext(1,44100,44100);wireTrack(eqContext,tone,{...t,low:-24},mix,0).source.start(0);const eqAudio=await eqContext.startRendering();let plainPower=0,eqPower=0;for(let i=4410;i<17640;i++){plainPower+=samples[i]*samples[i];eqPower+=eqAudio.getChannelData(0)[i]**2}
  assert(eqPower<plainPower*.6,'The real EQ audio graph changes rendered output')
  const blob=encodeWav(mixed);const asset='browser-test-audio';await saveAudioAsset(asset,blob);const loaded=await loadAudioAsset(asset)
  assert(loaded&&loaded.size===blob.size,'Imported audio persists in IndexedDB')
  const header=new DataView(await blob.arrayBuffer());assert(header.getUint32(24,true)===44100&&header.getUint16(22,true)===2,'WAV export has valid stereo PCM headers')
  document.body.dataset.status='passed'
} catch(error) { document.body.dataset.status='failed';const item=document.createElement('li');item.textContent=String(error);results.append(item) }
</script></html>
