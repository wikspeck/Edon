<!doctype html><html><body><button id="run">Run storage tests</button><pre id="result"></pre><script type="module">
import { saveAudioAsset, loadAudioAsset, backupLibrary, restoreLibrary } from '/src/music/audio-assets.ts';
document.querySelector('#run').onclick = async () => { const result = document.querySelector('#result'); try { const bytes = new Uint8Array([0, 11, 29, 255]); const song = { assetId:'qa-backup', name:'QA', notes:'keep', peaks:[], bpm:120 }; await saveAudioAsset(song.assetId, new Blob([bytes])); const library = { songs:[song], playlists:[{ id:'qa-playlist', name:'Birthday', songs:[song.assetId], notes:'party' }] }; const backup = await backupLibrary(library); const restored = await restoreLibrary(backup); if (JSON.stringify(library) !== JSON.stringify(restored)) throw Error('Metadata mismatch'); const audio = new Uint8Array(await (await loadAudioAsset(song.assetId)).arrayBuffer()); if (String(audio) !== String(bytes)) throw Error('Audio mismatch'); let rejected = false; try { await restoreLibrary(backup.slice(0, backup.size - 1)) } catch { rejected = true } if (!rejected) throw Error('Truncated backup accepted'); result.textContent = 'PASS: binary audio backup, playlist and song notes, restore, truncated-file rejection'; } catch(e) { result.textContent = 'FAIL: '+e.message } };
</script></body></html>
